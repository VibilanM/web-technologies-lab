<!DOCTYPE html>
<html>
<head>
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Number Guessing Game</h2>

    <p>
        Select a number:
        <span id="number">1</span>
    </p>

    <input
        type="range"
        id="guess"
        min="1"
        max="9"
        value="1"
        onchange="checkGuess()"
    >

    <p id="result"></p>

    <script src="script.js"></script>

</body>
</html>
